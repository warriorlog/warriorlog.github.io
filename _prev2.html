<style>/* Warriorlog — dark, phone-first, thumb-sized. Everything is sized so a set can
   be logged one-handed with sweaty hands, without reading carefully. */

:root {
  --bg: #0b0f14;
  --bg-raised: #131a23;
  --bg-card: #172029;
  --line: #24303d;
  --ink: #e8eef5;
  --ink-dim: #93a3b5;
  --ink-faint: #5f7186;
  --ember: #f0803c;
  --ember-deep: #c85a1e;
  --iron: #6b7280;
  --bronze: #cd7f32;
  --silver: #c0c0c0;
  --gold: #ffd700;
  --go: #35c07a;
  --go-deep: #1e7d4c;
  --cool: #4a8fd6;
  --radius: 14px;
  --tap: 56px;
  --pad: 16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.45;
  overscroll-behavior-y: contain;
}

body { min-height: 100dvh; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) var(--pad) calc(84px + env(safe-area-inset-bottom));
  min-height: 100dvh;
}

.boot { padding: 40vh 0; text-align: center; color: var(--ink-faint); }

h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0 0 10px; }

button, input, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; touch-action: manipulation; user-select: none; }

/* ------------------------------------------------------------------ layout */
.stack > * + * { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-dim); }
.faint { color: var(--ink-faint); }
.small { font-size: 14px; }
.tiny { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); }
.center { text-align: center; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hide { display: none !important; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--pad);
}
.card-tight { padding: 12px var(--pad); }

/* ------------------------------------------------------------------ header */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0 10px; gap: 12px;
}
.identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(160deg, var(--ember), var(--ember-deep));
  display: grid; place-items: center; font-weight: 800; color: #1b0f06; flex: none;
}
.avatar.partner { background: linear-gradient(160deg, var(--cool), #2b5f96); color: #06121b; }

.levelbar { height: 6px; background: var(--bg-raised); border-radius: 3px; overflow: hidden; }
.levelbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember-deep), var(--ember)); border-radius: 3px; }

.flame { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
.flame[data-state="ember"] { color: var(--ink-faint); }
.flame[data-state="cold"] { color: var(--ink-faint); }

/* ------------------------------------------------------------------ quest */
.quest { background: linear-gradient(165deg, #1b2634, var(--bg-card)); }
.quest .kicker { display: flex; gap: 8px; align-items: center; }
.pill {
  display: inline-block; padding: 3px 9px; border-radius: 999px;
  background: var(--bg-raised); border: 1px solid var(--line);
  font-size: 12px; letter-spacing: 0.03em; color: var(--ink-dim); white-space: nowrap;
}
.pill.hot { background: rgba(240,128,60,.14); border-color: rgba(240,128,60,.35); color: var(--ember); }
.pill.cool { background: rgba(74,143,214,.14); border-color: rgba(74,143,214,.35); color: var(--cool); }
.pill.go { background: rgba(53,192,122,.14); border-color: rgba(53,192,122,.35); color: var(--go); }

.btn {
  display: block; width: 100%; min-height: var(--tap);
  border-radius: 12px; font-weight: 800; font-size: 18px; letter-spacing: 0.02em;
  background: linear-gradient(180deg, var(--ember), var(--ember-deep)); color: #1b0f06;
}
.btn:active { transform: translateY(1px); }
.btn.secondary { background: var(--bg-raised); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost { background: none; color: var(--ink-dim); border: 1px solid var(--line); font-weight: 600; font-size: 16px; min-height: 48px; }
.btn.danger { background: none; color: #e5766b; border: 1px solid #4a2b28; }
.btn[disabled] { opacity: .45; }

/* ------------------------------------------------------------------ sets */
.exercise { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-card); overflow: hidden; }
.exercise + .exercise { margin-top: 12px; }
.exercise > header { padding: 14px var(--pad) 10px; }
.exercise.done > header { opacity: .6; }

.setrow {
  display: flex; align-items: stretch; gap: 10px;
  padding: 8px var(--pad); border-top: 1px solid var(--line);
}
.setno { width: 26px; display: grid; place-items: center; color: var(--ink-faint); font-size: 13px; flex: none; }
.target {
  flex: 1; min-height: var(--tap); border-radius: 10px;
  background: var(--bg-raised); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 22px; font-weight: 800;
}
.target .unit { font-size: 13px; font-weight: 600; color: var(--ink-faint); }
.target .last { font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.done-btn {
  width: 96px; min-height: var(--tap); border-radius: 10px; flex: none;
  background: linear-gradient(180deg, #1c2a37, #16212c);
  border: 1px solid var(--line); color: var(--ink-dim);
  font-weight: 800; letter-spacing: 0.04em;
}
.setrow.logged .done-btn { background: linear-gradient(180deg, var(--go), var(--go-deep)); color: #04160c; border-color: transparent; }
.setrow.logged .target { border-color: rgba(53,192,122,.4); color: var(--go); }
.setrow.dropped { opacity: .4; }

.cues { padding: 0 var(--pad) 12px; }
.cues li { color: var(--ink-dim); font-size: 14px; margin: 3px 0; }
.checklist { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 var(--pad) 12px; }
.cue {
  padding: 7px 11px; border-radius: 999px; font-size: 13px;
  background: rgba(53,192,122,.12); border: 1px solid rgba(53,192,122,.35); color: var(--go);
  min-height: 38px;
}
.cue[aria-pressed="true"] { background: rgba(240,128,60,.16); border-color: rgba(240,128,60,.45); color: var(--ember); }

/* ------------------------------------------------------------------ timer */
.resttimer {
  position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 5;
  margin: 12px 0 0; padding: 12px var(--pad);
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: 12px;
  display: flex; align-items: center; gap: 12px;
}
.resttimer .clock { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ sheet */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(4,7,10,.7); z-index: 40;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 560px; background: var(--bg-raised);
  border-radius: 18px 18px 0 0; border-top: 1px solid var(--line);
  padding: 18px var(--pad) calc(20px + env(safe-area-inset-bottom));
}
.stepper { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 14px 0; }
.stepper button { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--line); font-size: 28px; font-weight: 700; }
.stepper .value { font-size: 44px; font-weight: 800; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 10px 14px; min-height: 44px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--line); color: var(--ink-dim); font-weight: 600; }
.chip[aria-pressed="true"] { background: rgba(240,128,60,.16); border-color: var(--ember); color: var(--ember); }

/* ------------------------------------------------------------------ regions */
.regions { display: grid; gap: 7px; }
.region { display: grid; grid-template-columns: 78px 1fr 30px; align-items: center; gap: 9px; }
.region .name { font-size: 13px; color: var(--ink-dim); }
.region .bar { height: 12px; border-radius: 6px; background: var(--bg-raised); overflow: hidden; border: 1px solid var(--line); }
.region .bar > i { display: block; height: 100%; border-radius: 6px; }
.region .lvl { font-size: 13px; font-weight: 700; text-align: right; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.region.cold .name::after { content: " · cold"; color: var(--ink-faint); }

/* ------------------------------------------------------------------ nav */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; background: rgba(11,15,20,.94); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  backdrop-filter: blur(10px);
}
.tabbar a {
  flex: 1; min-height: 60px; display: grid; place-items: center; gap: 2px;
  text-decoration: none; color: var(--ink-faint); font-size: 11px; letter-spacing: 0.03em;
}
.tabbar a .glyph { font-size: 19px; line-height: 1; }
.tabbar a[aria-current="page"] { color: var(--ember); }

.syncdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); display: inline-block; }
.syncdot[data-state="pending"] { background: var(--ember); }
.syncdot[data-state="error"] { background: #e5766b; }
.syncdot[data-state="synced"] { background: var(--go-deep); }

/* ------------------------------------------------------------------ toasts */
.toasts { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 50; display: grid; gap: 8px; padding: 0 var(--pad); pointer-events: none; }
.toast {
  margin: 0 auto; max-width: 528px; width: 100%;
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: center; pointer-events: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
}
.toast .btn { width: auto; min-height: 40px; padding: 0 14px; font-size: 15px; }

/* ------------------------------------------------------------------ xp */
.xpfloat { color: var(--ember); font-weight: 800; font-size: 15px; }
.xpline { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
.bigxp { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; }

.gate { border-left: 3px solid var(--ember); padding-left: 12px; }
.locked { opacity: .75; }
.locked .target { background: #131b24; color: var(--ink-faint); }

.empty { padding: 36px 16px; text-align: center; color: var(--ink-faint); }

.week { display: flex; gap: 5px; }
.week span {
  flex: 1; aspect-ratio: 1; border-radius: 8px; background: var(--bg-raised);
  border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--ink-faint);
}
.week span[data-status="trained"] { background: rgba(240,128,60,.22); border-color: var(--ember); color: var(--ember); }
.week span[data-status="rest"] { background: rgba(74,143,214,.14); border-color: rgba(74,143,214,.35); color: var(--cool); }
.week span[data-status="shield"] { background: rgba(53,192,122,.12); border-color: rgba(53,192,122,.3); color: var(--go); }
.week span[data-status="pending"] { border-style: dashed; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ------------------------------------------------------- body map (silhouette)
   Token colours and the one animation live here; every geometric attribute is
   an SVG presentation attribute set in src/views/silhouette.js. */
.wl-fig {
  display: block; width: 100%; max-width: 264px; height: auto; margin: 2px auto 0;
  background: var(--bg); border-radius: var(--radius);
}
.wl-body { fill: var(--bg-card); }
.wl-filler { stroke: var(--iron); stroke-width: 1.2px; }
.wl-ground { fill: var(--ember); opacity: .07; }
.wl-track { stroke: var(--line); }
.wl-ring { stroke: var(--ember); }
.wl-tick { stroke: var(--ink-dim); opacity: .7; }
.wl-n { fill: var(--ink); stroke: var(--bg); font-family: var(--font); }
.wl-n0 { fill: var(--ink-faint); }
.wl-rg { cursor: default; }

.wl-pulse { fill: var(--ember); opacity: .92; transform-origin: 134px 120px; animation: wl-beat 1.9s ease-in-out infinite; }
@keyframes wl-beat {
  0%, 62%, 100% { transform: scale(1); opacity: .82; }
  10% { transform: scale(1.13); opacity: 1; }
  22% { transform: scale(1); opacity: .86; }
  32% { transform: scale(1.08); opacity: .96; }
}
@media (prefers-reduced-motion: reduce) {
  .wl-pulse { animation: none; transform: none; opacity: .9; }
}

.wl-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; }
.wl-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-faint); }
.wl-legend i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; display: inline-block; }
